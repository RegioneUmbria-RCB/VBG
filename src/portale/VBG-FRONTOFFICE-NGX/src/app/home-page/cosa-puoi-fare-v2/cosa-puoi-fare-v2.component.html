<div class="container-fluid sezione-home home-servizi-online-v2">
  <div class="container">
    <h2>Cosa vuoi fare?</h2>

    <div class="row">
      <div class="col-md-4 box-container">
        @for (card of cards; track card) {
        <div>
          @if (card.link.startsWith("http")) {
          <a [href]="card.link" target="_blank">
            <div class="box-funzione">
              <h3>{{ card.titolo }}</h3>
              <p>{{ card.sottotitolo }}</p>
            </div>
          </a>
          } @else {
          <a [routerLink]="[card.link]" target="_blank">
            <div class="box-funzione">
              <h3>{{ card.titolo }}</h3>
              <p>{{ card.sottotitolo }}</p>
            </div>
          </a>
          }
        </div>
        }
      </div>
      <div class="col-md-8">
        <div>
          <img src="{{ immagineDefault }}" srcset="{{srcsetList}}" alt="" aria-hidden="true" />
        </div>
      </div>
    </div>
  </div>
</div>
