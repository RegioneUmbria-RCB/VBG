@if (dataSource && dataSource.length) {
  <div>
    <table class="table table-striped table-hover">
      <thead>
        <tr>
          <th>Titolo</th>
          <th>Testo</th>
        </tr>
      </thead>
      <tbody>
        @for (item of dataSource; track item) {
          <tr>
            <td>{{ item.titolo }}</td>
            <td [innerHTML]="item.descrizione"></td>
          </tr>
        }
      </tbody>
    </table>
  </div>
}
