<app-inner-page-layout [isLoading]="isLoading">
    <app-interventi-detail
        [intervento]="intervento$ | async"
        [permetteDownloadModello]="permetteDownloadModello"
        (tornaIndietro)="tornaIndietro()"
        (download)="download($event)"
        (endoprocedimentoSelezionato)="onEndoprocedimentoSelezionato($event)"
        (scaricaModello)="onScaricaModello($event)"
        (vaiAServizio)="onVaiAServizio($event)"
        [isUrlVaiAServizioPresente]="isUrlVaiAServizioPresente"
    >
    </app-interventi-detail>
</app-inner-page-layout>
