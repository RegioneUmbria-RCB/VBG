@if (dataSource && dataSource.length) {
  <div>
    <table class="table table-striped table-hover">
      <thead>
        <tr>
          <th>Causale</th>
          <th>Importo</th>
        </tr>
      </thead>
      <tbody>
        @for (item of dataSource; track item) {
          <tr>
            <td>{{ item.causale }}</td>
            <td>€ {{ item.importo }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
}
