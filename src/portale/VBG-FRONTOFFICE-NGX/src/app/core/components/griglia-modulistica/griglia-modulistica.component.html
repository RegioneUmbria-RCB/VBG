@if (dataSource && dataSource.length) {
  <div>
    <table class="table table-striped table-hover">
      <thead>
        <tr>
          <th>Obbligatorio</th>
          <th>Descrizione</th>
          <th>Scarica</th>
        </tr>
      </thead>
      <tbody>
        @for (item of dataSource; track item) {
          <tr>
            <td>
              @if (item.obbligatorio) {
                <i
                  class="glyphicon glyphicon-ok"
                ></i>
              }
            </td>
            <td [innerHtml]="item.descrizione"></td>
            <td>
              @if (item.codiceOggetto) {
                <span
                  class="link"
                  (click)="onDownload(item.codiceOggetto?.toString())"
                  >Scarica</span
                  >
                }
                @if (item.downloads && item.downloads.length) {
                  <div>
                    @for (d of item.downloads; track d) {
                      <span
                        class="link"
                        (click)="onDownload(d.codiceOggetto?.toString())"
                        >Scarica</span
                        >
                      }
                    </div>
                  }
                </td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    }
