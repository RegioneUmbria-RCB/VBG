openapi: 3.0.0
info:
  title: Inserimento pratica da ZIP
  version: 1.1.0
  x-api-id: 62d8d908-4701-11e9-b210-d663bd873d93
  x-catalog:
    properties:
      tag:
        - Inserimento pratiche da ZIP
        - SUAPE 3.0
      category:
        - cataloghi indici elenchi
  x-ecosystem:
    - name: Ecosistema digitale regionale
      url: REDACTED
      description: Ecosistema digitale regionale Umbria
  x-summary: API per l'inserimento delle pratiche da uno ZIP file (es. AUA SUAPE Umbria)
  description: "#### Documentazione\nAPI che restituscono la lista delle pratiche per un utente su tutti i comuni dove è presente il SUAPE 3.0"
  contact:
    name: Riferimento Tecnico - PA Evolution
#    url: REDACTED
    email: "servicedesk@umbriadigitale.it"
  # Per tutte le API pubblicate sull'Ecosistema digitale regionale
  # lasciare 'https://apistore.regione.umbria.it/terms'
  termsOfService: 'https://apistore.regione.umbria.it/terms'
  # Team Digitale - L'audience delle API. Attualmente e' definito solamente
  #   la tipologia `public`.
  x-audience:
    - public
  x-lifecycle:
    published: "2021-10-21T00:00:00.000Z"
    maturity: published

# Una lista di `tag` utili a raggruppare le varie operazioni
#   eseguite dalle API. Ogni `tag` puo' referenziare un link
#   alla sua descrizione.
tags:
  - name: inserimento pratiche
    description: Servizio di inserimento pratica
    externalDocs:
    #L'url va sostituito con quello della documentazione
      url: REDACTED
  - name: status
    description: metodo per verificare lo stato dei servizi di questa API

paths:
  /crea-pratica-da-zip/{numero_protocollo}/{data_protocollo}:
    post:
      description: Inoltra una pratica inbustata in uno zip file.I parametri numero_protocollo e data_protocollo sono obbligatori e si riferiscono ai dati di protocollazione della pratica nell'ente. Il formato della data ammesso è yyyy-MM-dd
      operationId: crea-pratica
      tags:
        - inserimento pratiche
      responses:
        "200":
          description: Chiamata effettuata con successo
          content:
            application/json:
              schema:
                type: object
                title: risultati di inserimento della pratica
                required:
                  - result
                properties:
                  result:
                    type: object
                    items:
                      $ref: "#/components/schemas/Result"
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal server error
      parameters:
        - in: path
          name: numero_protocollo
          schema:
            type: string
          required: true
          description: numero del protocollo con il quale lo zip file è stato registrato nell'ente che invia la pratica
        - in: path
          name: data_protocollo
          schema:
            type: string
          required: true
          description: la data del protocollo con il quale lo zip file è stato registrato nell'ente che invia la pratica. Il formato ammesso è yyyy-MM-dd
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                fileName:
                  type: string
                  format: binary
      summary: "Inserimento di una pratica da un file ZIP"
      x-auth-type: None
      x-throttling-tier: Unlimited

  #
  # Questa risorsa deve essere sempre presente e serve per verificare lo stato del servizio di backend
  #

  /status:
    get:
      summary: Ritorna lo stato del servizio di backend.
      description:  |
        Ritorna lo stato del servizio di backend. A scopo
        di test, su base randomica puo' ritornare
        un errore.
      operationId: getStatus
      tags:
        - status
      responses:
        <<: *common-responses
        '200':
          description: |
            Il server ha ritornato lo status. In caso di problemi
            ritorna sempre un problem+json.
          # Il Rate Limit e' in fase di implementazione nell'Ecosistema Digitale, quindi l'headers seguente va lasciato commentato
          #headers:
          #  <<: *ratelimit-headers
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

servers:
  - url: REDACTED
    description: Server sviluppo
components:


  securitySchemes:
    oAuth2ClientCredentials:REDACTED
      type: oauth2
      description: Per maggiori informazioni https://apistore.regione.umbria.it/store/forum
      flows:
        clientCredentials:REDACTED
          tokenUrl: REDACTED
          scopes: {}

  headers:
    X-RateLimit-Limit:
      $ref: 'https://teamdigitale.github.io/openapi/0.0.5/definitions.yaml#/headers/X-RateLimit-Limit'
    X-RateLimit-Remaining:
      $ref: 'https://teamdigitale.github.io/openapi/0.0.5/definitions.yaml#/headers/X-RateLimit-Remaining'
    X-RateLimit-Reset:
