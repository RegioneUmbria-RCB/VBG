  responses:
    # Risposte predefinite restituite dall'API Manager dell'Ecosistema (https://apistore.regione.umbria.it/apierrorcode/errors.html)
    # Queste risposte devono essere sempre presenti
    400BadRequest:
      $ref: 'https://raw.githubusercontent.com/RegioneUmbria/ecosistema-openapi/0.0.1/definitions.yaml#/responses/400BadRequest'
    401Unauthorized:
      $ref: 'https://raw.githubusercontent.com/RegioneUmbria/ecosistema-openapi/0.0.1/definitions.yaml#/responses/401Unauthorized'
    404NotFound:
      $ref: 'https://raw.githubusercontent.com/RegioneUmbria/ecosistema-openapi/0.0.1/definitions.yaml#/responses/404NotFound'
    429TooManyRequests:
      $ref: 'https://raw.githubusercontent.com/RegioneUmbria/ecosistema-openapi/0.0.1/definitions.yaml#/responses/429TooManyRequests'
    500InternalServerError:
      $ref: 'https://raw.githubusercontent.com/RegioneUmbria/ecosistema-openapi/0.0.1/definitions.yaml#/responses/500InternalServerError'
    503ServiceUnavailable:
      $ref: 'https://raw.githubusercontent.com/RegioneUmbria/ecosistema-openapi/0.0.1/definitions.yaml#/responses/503ServiceUnavailable'
    default:
      $ref: 'https://raw.githubusercontent.com/RegioneUmbria/ecosistema-openapi/0.0.1/definitions.yaml#/responses/default'


  schemas:

    Result:
      title: Result
      properties:
        mittente:
          type: string
        destinatario:
          type: string
        id_pratica:
          type: string
        numero_pratica:
          type: string
        data_pratica:
          type: string
        numero_protocollo_generale:
          type: string
        data_protocollo_generale:
          type: string
        errore:
          type: object
          items:
            $ref: "#/components/schemas/Errore"
        
    Errore:
      title: Errore
      properties:
        codice:
          type: string
        descrizione:
          type: string


    Problem:
      properties:
        detail:
          description: "A human readable explanation specific to this occurrence of the\nproblem.\n"
          example: Generic API invocation error
          type: string
        instance:
          description: "An absolute URI that identifies the specific occurrence of the problem.\nIt may or may not yield further information if dereferenced.\n"
          format: uri
          type: string
        status:
          description: "The HTTP status code generated by the origin server for this occurrence\nof the problem.\n"
          example: 500
          exclusiveMaximum: true
          format: int32
          maximum: 600
          minimum: 100
          type: integer
        title:
          description: "A short, summary of the problem type. Written in english and readable\nfor engineers (usually not suited for non technical stakeholders and\nnot localized); example: Service Unavailable\n"
          type: string
        type:
          default: "about:blank"
          description: "An absolute URI that identifies the problem type.  When dereferenced,\nit SHOULD provide human-readable documentation for the problem type\n(e.g., using HTML).\n"
          format: uri
          type: string
      type: object
