#impostazioni di log per le procedure di ottimizzazione dei documenti su filesystem
# e di migrazione dei documenti da BLOB a filesystem
#file in cui vengono loggate tutte le attività delle procedure record per record
log4j.logger.it.gruppoinit.docfs.activity=DEBUG, docfsactivitylogfile
log4j.additivity.it.gruppoinit.docfs.activity=false
#file in cui vengono loggati solo gli errori delle procedure ciascuno su un'unica riga senza lo stack delle eccezioni
log4j.logger.it.gruppoinit.docfs.error=ERROR, docfserrorlogfile
log4j.additivity.it.gruppoinit.docfs.error=false
#file in cui vengono loggate tutte le eccezioni delle procedure compreso lo stack delle eccezioni
log4j.logger.it.gruppoinit.docfs.exception=ERROR, docfsexceptionlogfile
log4j.additivity.it.gruppoinit.docfs.exception=false

#impostazioni di log per UPGR4J
#file in cui vengono loggate tutte le attività di UPGR
log4j.logger.it.gruppoinit.upgr.activity=DEBUG, upgractivitylogfile
log4j.additivity.it.gruppoinit.upgr.activity=false

#file in cui vengono loggati solo gli errori di UPGR uno per riga senza lo stack delle eccezioni
log4j.logger.it.gruppoinit.upgr.error=WARN, upgrerrorlogfile
log4j.additivity.it.gruppoinit.upgr.error=false

#file in cui vengono loggate tutte le eccezioni di UPGR con la stampa dello stack delle eccezioni
log4j.logger.it.gruppoinit.upgr.exception=ERROR, upgrexceptionlogfile
log4j.additivity.it.gruppoinit.upgr.exception=false

#impostazioni di log per IMPORT
log4j.logger.it.gruppoinit.dataimport=DEBUG, logfileimport
log4j.additivity.it.gruppoinit.dataimport=false

#impostazioni di log per AuditingSuFile per il layer web
log4j.logger.it.gruppoinit.auditing.web_activity=WARN, auditsufileweblogfile
log4j.additivity.it.gruppoinit.auditing.web_activity=false

#impostazioni di log per AuditingSuFile per gli errori dei services
log4j.logger.it.gruppoinit.auditing.service_errors=WARN, auditsufileserviceerrorlogfile
log4j.additivity.it.gruppoinit.auditing.service_errors=false

#impostazioni di log per le cancellazioni dei dati dell'istanza
log4j.logger.it.gruppoinit.pal.gp.core.utils.LoggerCancellazioni=DEBUG, loggercancellazioni
log4j.additivity.it.gruppoinit.pal.gp.core.utils.LoggerCancellazioni=false

#impostazioni di log per l'allineamento stradario
log4j.logger.it.gruppoinit.pal.gp.core.utils.LoggerAllineamentostradario=DEBUG, loggerallineamentostradario
log4j.additivity.it.gruppoinit.pal.gp.core.utils.LoggerAllineamentostradario=false

