log4j.appender.upgractivitylogfile=org.apache.log4j.RollingFileAppender
log4j.appender.upgractivitylogfile.File=${catalina.base}/logs/smart-consolle-upgr-activity.log
log4j.appender.upgractivitylogfile.MaxBackupIndex=20
log4j.appender.upgractivitylogfile.MaxFileSize=10240KB
log4j.appender.upgractivitylogfile.layout=org.apache.log4j.PatternLayout
log4j.appender.upgractivitylogfile.layout.ConversionPattern=%d [%t] %-5p - %m%n

log4j.appender.upgrerrorlogfile=org.apache.log4j.RollingFileAppender
log4j.appender.upgrerrorlogfile.File=${catalina.base}/logs/smart-consolle-upgr-error.log
log4j.appender.upgrerrorlogfile.MaxBackupIndex=20
log4j.appender.upgrerrorlogfile.MaxFileSize=10240KB
log4j.appender.upgrerrorlogfile.layout=org.apache.log4j.PatternLayout
log4j.appender.upgrerrorlogfile.layout.ConversionPattern=%d [%t] %-5p - %m%n

log4j.appender.upgrexceptionlogfile=org.apache.log4j.RollingFileAppender
log4j.appender.upgrexceptionlogfile.File=${catalina.base}/logs/smart-consolle-upgr-exception.log
log4j.appender.upgrexceptionlogfile.MaxBackupIndex=20
log4j.appender.upgrexceptionlogfile.MaxFileSize=10240KB
log4j.appender.upgrexceptionlogfile.layout=org.apache.log4j.PatternLayout
log4j.appender.upgrexceptionlogfile.layout.ConversionPattern=%d [%t] %-5p %c %n - %m%n

log4j.appender.logfileimport=org.apache.log4j.RollingFileAppender
log4j.appender.logfileimport.File=${catalina.base}/logs/smart-consolle-import.log
log4j.appender.logfileimport.MaxFileSize=2048KB
log4j.appender.logfileimport.MaxBackupIndex=20
log4j.appender.logfileimport.layout=org.apache.log4j.PatternLayout
log4j.appender.logfileimport.layout.ConversionPattern=%d [%t] %-5p %c - %m%n

log4j.appender.docfsactivitylogfile=org.apache.log4j.RollingFileAppender
log4j.appender.docfsactivitylogfile.File=${catalina.base}/logs/smart-consolle-documenti-filesystem.activity.log
log4j.appender.docfsactivitylogfile.MaxFileSize=2048KB
log4j.appender.docfsactivitylogfile.MaxBackupIndex=20
log4j.appender.docfsactivitylogfile.layout=org.apache.log4j.PatternLayout
log4j.appender.docfsactivitylogfile.layout.ConversionPattern=%d %-5p [%c] - %m%n

log4j.appender.docfserrorlogfile=org.apache.log4j.RollingFileAppender
log4j.appender.docfserrorlogfile.File=${catalina.base}/logs/smart-consolle-documenti-filesystem.error.log
log4j.appender.docfserrorlogfile.MaxFileSize=2048KB
log4j.appender.docfserrorlogfile.MaxBackupIndex=20
log4j.appender.docfserrorlogfile.layout=org.apache.log4j.PatternLayout
log4j.appender.docfserrorlogfile.layout.ConversionPattern=%d %-5p [%c] - %m%n

log4j.appender.docfsexceptionlogfile=org.apache.log4j.RollingFileAppender
log4j.appender.docfsexceptionlogfile.File=${catalina.base}/logs/smart-consolle-documenti-filesystem.exception.log
log4j.appender.docfsexceptionlogfile.MaxFileSize=2048KB
log4j.appender.docfsexceptionlogfile.MaxBackupIndex=20
log4j.appender.docfsexceptionlogfile.layout=org.apache.log4j.PatternLayout
log4j.appender.docfsexceptionlogfile.layout.ConversionPattern=%d %-5p [%c] %n - %m%n

log4j.appender.auditsufileweblogfile=org.apache.log4j.DailyRollingFileAppender
log4j.appender.auditsufileweblogfile.File=${catalina.base}/logs/audit/smart-consolle-smart-consolle-audit-web.log
log4j.appender.auditsufileweblogfile.DatePattern='.'yyyy-MM-dd'.txt'
#log4j.appender.auditsufileweblogfile.MaxBackupIndex=20
#log4j.appender.auditsufileweblogfile.MaxFileSize=10240KB
log4j.appender.auditsufileweblogfile.layout=org.apache.log4j.PatternLayout
log4j.appender.auditsufileweblogfile.layout.ConversionPattern=%d %n%m%n

log4j.appender.auditsufileserviceerrorlogfile=org.apache.log4j.DailyRollingFileAppender
log4j.appender.auditsufileserviceerrorlogfile.File=${catalina.base}/logs/audit/smart-consolle-audit-servicerror.log
log4j.appender.auditsufileserviceerrorlogfile.DatePattern='.'yyyy-MM-dd'.txt'
#log4j.appender.auditsufileserviceerrorlogfile.MaxBackupIndex=20
#log4j.appender.auditsufileserviceerrorlogfile.MaxFileSize=10240KB
log4j.appender.auditsufileserviceerrorlogfile.layout=org.apache.log4j.PatternLayout
log4j.appender.auditsufileserviceerrorlogfile.layout.ConversionPattern=%d %n%m%n

log4j.appender.loggercancellazioni=org.apache.log4j.DailyRollingFileAppender
log4j.appender.loggercancellazioni.File=${catalina.base}/logs/audit/smart-consolle-cancellazioni.log
log4j.appender.loggercancellazioni.DatePattern='.'yyyy-MM-dd'.txt'
#log4j.appender.loggercancellazioni.MaxBackupIndex=20
#log4j.appender.loggercancellazioni.MaxFileSize=10240KB
log4j.appender.loggercancellazioni.layout=org.apache.log4j.PatternLayout
log4j.appender.loggercancellazioni.layout.ConversionPattern=%d %n%m%n

log4j.appender.loggerallineamentostradario=org.apache.log4j.DailyRollingFileAppender
log4j.appender.loggerallineamentostradario.File=${catalina.base}/logs/audit/smart-consolle-allineamento-stradario.log
log4j.appender.loggerallineamentostradario.DatePattern='.'yyyy-MM-dd'.txt'
#log4j.appender.loggerallineamentostradario.MaxBackupIndex=20
#log4j.appender.loggerallineamentostradario.MaxFileSize=10240KB
log4j.appender.loggerallineamentostradario.layout=org.apache.log4j.PatternLayout
log4j.appender.loggerallineamentostradario.layout.ConversionPattern=%d %n%m%n

log4j.appender.mail=org.apache.log4j.net.SMTPAppender
#defines how often emails are sent
log4j.appender.mail.BufferSize=1
log4j.appender.mail.SMTPHost=
log4j.appender.mail.SMTPUsername=REDACTED
log4j.appender.mail.SMTPPassword=REDACTED
log4j.appender.mail.From=
log4j.appender.mail.To=
log4j.appender.mail.Subject="Email inviata in automatico dal backoffice del server [name] in caso di errore."
log4j.appender.mail.layout=org.apache.log4j.PatternLayout
log4j.appender.mail.layout.ConversionPattern=%d %p [%c] - %m%n

