# PARAMETRI DI DEPLOY
servizi.resolver.filter.path.ammessi=

# WEB SERVICE SECURITY
ws.token.pwd=REDACTED
ws.token.url=REDACTED
ws.token.user=REDACTED
ws.token.default.alias=CONSOLE

# CERTIFICATO PER VERIFICARE LA FIRMA DELL'AUTENTICAZIONE
authentication.public.key.cert=publicKeyAccettatore.cer

# possibilità di accedere ai servizi solo da url paranti Es: /d612/nuovadomanda
# se true allora solamente gli URL intercettati da ServiziResolverFilter saranno accedibili 
servizi.accedi-se-attiva-session=true

# DATI PER ACCESSO TRAMITE SERVIZIO
servizi.idcomunealias=CONSOLE
servizi.software=SS
# CODICE FISCALE DELL'UTENTE PER I SERVIZI ANONIMI (DEVE ESSERE PRESENTE IN ANAGRAFE)
