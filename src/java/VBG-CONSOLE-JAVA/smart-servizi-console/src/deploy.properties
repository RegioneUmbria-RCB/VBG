app.aspnet=consolle-net-bo

# WEB SERVICE STC
ws.stc.url=REDACTED
ws.stc.user=REDACTED
ws.stc.pwd=REDACTED
ws.stc.id-nodo-mitt=1200
ws.stc.id-nodo-dest=400
ws.stc.timeout=300000

# CODICE FISCALE DELL'UTENTE UTILIZZATO DALL'NLA PER LA LOGIN APPLICATIVA (DEVE ESSERE PRESENTE IN ANAGRAFE)
