form.mercatiConti.flagValore.help                                              = Se inserisco un valore nel campo coefficiente l'importo totale del conto risulta calcolato in base alla formula:<br/>\r\n COEFFICIENTE x NUMERO GIORNI MANIFESTAZIONE x MQ POSTEGGIO x COEFF. VIARIO DEL POSTEGGIO X COEFF. MERCEOLOGICO (della pratica del concessionario).<br/>\r\nSe inserisco un valore nel campo importo, l'importo totale del conto risulta ANNUALE (se non spuntato mensile altrimenti MENSILE) e pari al valore inserito.
