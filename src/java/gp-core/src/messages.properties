label.firma_congiunta_cades.help                                                         = Le firme <i><b>DIGITALI CONGIUNTE O PARALLELE</b></i> sono apposte allo stesso documento informatico da diversi soggetti utilizzando la medesima busta crittografica informatica.<br />La firma parallela \u00E8 possibile <b>SOLAMENTE</b> per file che abbiano gi\u00E0 estensione (.p7m) ovvero precedentemente firmati. <br />La differenza con una seconda firma cades, nel caso in cui non si voglia firmare in modalit\u00E0 parallela o congiunta, \u00E8 che ad ogni nuova firma viene creata una nuova busta crittografica che si sovrappone all'altra. <br />L'applicativo rilancia errore nel caso si scelga la firma congiunta ed il file non risulti gi\u00E0 firmato.<br />La firma congiunta <b>NON viene applicata ai PDF</b>, \u00E8 il caso ad esempio del formato <b>PAdES</b>, in quanto questi non ne prevede l'utilizzo. Nel formato PAdES ogni firma \u00E8 inserita in aggiunta e, pertanto, copre l'intero contenuto del file PDF di input, comprese le eventuali firme gi\u00E0 esistenti.
