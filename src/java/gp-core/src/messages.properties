form.mercatiConfigurazione.identaut.parametri.help                             = PARAMETRO VALIDO SOLO PER LE FIERE\r\nImpostando correttamente gli estremi dell'autorizzazione verr&agrave; cambiata la modalit&agrave;<br/>\r\ndi storicizzazione delle presenze. In questo caso le presenze non saranno storicizzate <br/> per anagrafica, ma per gli estremi dell'autorizzazione. <br/>\r\nSelezionare, quindi, il modello della scheda dinamica dove sono presenti i campi  <br/>che identificano gli estremi dell'autorizzazione.
