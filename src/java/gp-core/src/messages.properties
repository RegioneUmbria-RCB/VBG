alberoproc.help.alberoprocEndo_flagPrincipale                       = Se spuntato indica che \u00E8 il procedimento che identifica l'attivit\u00E0 <br />\r\ne l'intervento oggetto della navigazione.<br/>\r\nGeneralmente \u00E8 un procedimento di competenza<br/>\r\ndell'ufficio e non di enti terzi. <br/>\r\nUn solo procedimento pu\u00F2 essere identificato come principale o primario. <br/>\r\nEs. con una navigazione dell'alberatura del tipo <br/>\r\n"Commercio/Commercio al dettaglio/Esecizi di vicinato/Nuova apertura" <br/>\r\nandr\u00E0 ad attivare un procedimento principale tipo "Avvio nuovo esercizio di vicinato".<br/>\r\nP\u00F9\u00F2 essere presente un solo endoprocedimento principale <br/>\r\nper ogni voce dell'albero.
