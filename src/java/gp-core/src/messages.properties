help.ccCausaliriduzionir_riduzioneperc                  = Se il valore \u00E8 salvato con segno meno allora si tratta di una riduzione, altrimenti viene considerato come un incremento
help.cerca_testuale_in_anagrafe                         = La ricerca testuale per Persona Fisica \u00E8 effettuata  per "Cognome" "Nome" (Es. Rossi Mario); pu\u00F2 essere fatta utilizzando anche solo parte del cognome e/o  del nome. Se si vuole ricercare solo per nome la stringa deve essere preceduta dal carattere "%".
help.codice                                             = Non \u00E8 possibile modificare il codice.<br/>Eliminare e ripetere la procedura di inserimento 
