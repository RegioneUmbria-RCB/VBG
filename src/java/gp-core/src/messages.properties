form.mercatiConfigurazione.settori.help                                        = Indica qual'\u00E8 il tipo di informazione che permette di qualificare, <br />\r\nmediante il dettaglio informazione associata, i posteggi di un mercato/fiera.<br/>\r\nAd esempio se il tipo di informazione si chiama "Categorie merceologiche" avremo<br/>\r\nnel dettaglio informazione "Alimentari","non alimentari", ecc....<br/>\r\nServe inoltre per filtrare il dettaglio informazione nella sezione <b>Parametri attivit\u00E0 collegate.</b><br/>
