help.anagrafestorico.legenda                            = Le informazioni contrassegnate con <span  class="anagrafeDiffValue">dato anagrafico</span> rappresentano i dati della scheda anagrafica pi\u00F9 recente.
help.cambia_fascicolazione_messaggio                    = Nella funzionalit\u00E0 "<b>Cambia fascicolo</b>"<br />\u00E8 necessario utilizzare un fascicolo esistente.<br /><b>ATTENZIONE!</b> Se il numero e la data del fascicolo non sono validi<br/>sar\u00E0 restituito un errore.
help.campi_dinamici_autorizzazione                      = Rappresentano i campi dinamici del modello utilizzato nelle domande presentate per recuperare gli estremi dell'autorizzazione
