form.configurazioneContiMercato.message                                        = <fieldset><legend><div id="error_msg" class="error_header" >Attenzione!!!</div></legend>\r\nState creando un calendario e siccome \u00E8 attivata la gestione contabile \u00E8 necessario provvedere alla configurazione del costo dei posteggi per l\u2019anno scelto. <br />La funzionalit\u00E0 ha come punto di partenza la configurazione dei conti dell'anno precedente, se presente, altrimenti non verr\u00E0 visualizzata alcuna informazione e sar\u00E0 necessario configurare i conti del mercato e dei posteggi.<br />E' possibile utilizzare le righe dell'anno precedente adeguando il  costo attraverso un coefficiente moltiplicatore. Qualora si voglia disabilitare una voce \u00E8 necessario togliere la spunta sulla casella di controllo in fondo alle righe.<br />E' possibile, comunque, gestire manualmente l'operazione nella pagina di configurazione dei conti della manifestazione e per posteggio all'interno del dettaglio di una manifestazione.\r\n</fieldset>
