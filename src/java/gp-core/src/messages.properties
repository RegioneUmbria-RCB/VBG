help.composizioneCodiceSTC                              = (Selezionare un'Amministrazione o un Nodo)
help.comuniesclusioni                                   = I comuni selezionati saranno esclusi nell'area riservata 
help.configurazione.codice_ente_payer                   = Il parametro va inserito in caso di integrazione con PayER. Identifica il codice Ente che viene inviato nei messaggi di cooperazione applicativa tra Backoffice e Payer.
help.configurazione.codiceamministrazione_ipa           = Codice amministrazione definita nell'indice delle pubbliche amministrazioni (IPA).<br />Al momento utilizzato nelle comunicazioni con Registro imprese per identificare l'amministrazione comunale mittente.
help.configurazione.codiceaoo                           = Codice Area Omogenea Organizzativa. Con l'acronimo AOO sono identificati gli uffici di protocollo delle Amministrazioni che gestiscono i flussi documentali in entrata e in uscita dall'Amministrazione. Serve per identificare il relativo codice nelle comunicazioni verso enti esterni. Al momento viene utilizzato nella comunicazione con registro imprese.
help.configurazione_filtri_nature_default               = La configurazione di default delle nature endo impostate come filtri <br /> \u00E8  legata alla natura della procedura associata all' istanza in esame.\r\n
help.crea_repliche_gestisci_attivita_collegata          = Se selezionato, nel caso l'istanza sorgente sia collegata ad un attivit\u00E0 anche la replica vi verr\u00E0 associata. Verranno ricalcolate le caratteristiche dell'attivit\u00E0: Operante, Attiva, Ultima istanza. 
help.data_scadenza_conti                                = Indicare la data di fine validit\u00E0 del conto configurato
help.data_validita_stradario                            = Se indicata una "Data disabilitato" allora non sar\u00E0 possibile usare lo stradario nelle funzionalit\u00E0 di inserimento ma rester\u00E0 disponibile in quelle di ricerca.
help.destinatari                                        = (1*) L'invio verr\u00E0 effettuato a tutti gli operatori, con indirizzo email popolato, attivi per il comune e per il modulo della pratica a cui \u00E8 associato il movimento. E' possibile utilizzare questa funzione in caso di ambienti in cui l'operatore e l'istruttore non vengono definiti in fase di inserimento pratica e si vuole mandare una comunicazione generica a tutti gli operatori. Ad Es.: Arrivo nuova pratica, Arrivo di un integrazione, Arrivo di una notifica da altro Modulo.
help.dettaglio_importo_interesse                        = Il valore non \u00E8 modificabile. E' calcolato dalla funzionalit\u00E0 rateizzazione e indica la quota interesse presente in Importo 
help.documentazione_pubblica                            = Indica se il documento deve<br/>essere pubblicato.
help.documentazione_richiesta                           = Indica se il documento \u00E8 obbligatorio<br/>per la presentazione della domanda on-line
help.endo_procedimenti_archivi_base                     = Se selezionato, ricerca solo gli endoprocedimenti di base
help.flag_accedi_schede                                 = Se spuntato nella pagina di elaborazione istanza il click su un movimento da eseguire, che ha configurate delle schede dimaniche, lo eseguir\u00E0 automaticamente e l'utente sar\u00E0 inviato alla pagina di gestione schede.
help.flag_allegati_link                                 = Se spuntato, in fase di invio mail verr\u00E0 proposto il comportamento di inviare i link ai documenti anzich\u00E9 gli allegati fisici. I link possono stare nel corpo della mail (segnaposto [LINKALLEGATI] ) o nell\u2019eventuale documento tipo specificato sotto, che dovr\u00E0 contenere il segnaposto [-LINKALLEGATI-]. 
help.flag_allegati_link_protocollo                      = Se spuntato, in fase di protocollazione viene proposto il comportamento di protocollare il documento specificato sotto contenente il segnaposto [-LINKALLEGATI-]. Il segna posto verr\u00E0 sostituito con i link per scaricare i documenti selezionati.
help.flag_autoriz_modifica                              = Se selezionato applicher\u00E0 all'esecuzione del movimento la funzionalit\u00E0 di modifica dell'autorizzazione dell'istanza padre.
help.flag_autoriz_preavv                                = Se selezionato applicher\u00E0 all'esecuzione del movimento la funzionalit\u00E0 di preavviso dell'autorizzazione dell'istanza padre.
help.flag_autoriz_proroga                               = Se selezionato applicher\u00E0 all'esecuzione del movimento la proroga dell'autorizzazione dell'istanza padre.
help.flag_autoriz_rinnovo                               = Se selezionato applicher\u00E0 all'esecuzione del movimento la funzionalit\u00E0 di rinnovo dell'autorizzazione dell'istanza padre.
help.flag_in_primo_piano                                = Consente la pubblicazione della news corredata da immagini nella sezione "In primo piano"
help.flag_notifica_automatica                           = Se attivato, all'inserimento di un movimento di questo tipo verr\u00E0 contestualmente effettuata la notifica. Sono possibili tre casi:<ol><li><b>Nessuna notifica automatica</b><br />Nessun meccanismo di notifica automatica</li><li><b>Notifica automatica</b><br/>La notifica automatica avverr\u00E0 per qualsiasi movimento e contromovimento. I contromovimenti configurati come da notificare e con questo comportamento risulteranno eseguiti e saranno notificati contestualmente all'inserimento del movimento.</li><li><b>Notifica automatica all'inserimento del movimento.</b><br/>La notifica sar\u00E0 avviata automaticamente solamente all'inserimento del movimento e non interverr\u00E0 sui contromovimenti, come nel caso precedente.</li></ol>
help.fo_estensioni_ammesse                              = Lista estensioni separate da virgola Es. .txt,pdf,p7m,etc
help.inserimento_url_preferiti                          = (*) In caso di link interno al sistema nel campo URL deve essere riportata solo la parte finale dell'indirizzo come riportato in figura
help.istruttore_assegnato_anticorruzione                = L'istruttore \u00E8 stato assegnato tramite la funzionalit\u00E0 anti corruzione. Per modificarlo cliccare sull'icona accanto; l'operazione verr\u00E0 tracciata
help.label.copia_dscrizione_conto                       = Se lasciato vuoto verr\u00E0 popolato con la descrizione del conto/accertamento
help.label.date_archiviazione                           = Se popolate, vanno a sovrascrivere le eventuali date impostate nella verticalizzazione
help.label.mercatiLivelloServizio_non_attivo            = Il Servizio non \u00E8 pi\u00F9 attivo, non sar\u00E0 possibile apportare modifiche
help.label.procedura_aggiornamento_livello              = Nel caso si voglia modificare il valore della tariffa, l'intervallo di date, la tipologia di servizio si pu\u00F2 utilizzare: <br /><ul><li>La procedura guidata: aggiorna tariffe</li><li>Procedura di disattivazione del livello con successiva creazione di un nuovo livello</li></ul>
help.label.ricerca_globale                              = Impostando la ricerca come globale sar\u00E0 visibile a tutti gli operatori.
help.label.usa_mq_posteggio                             = Se selezionato nel calcolo del costo del singolo livello di servizio non verr\u00E0 preso in considerazione il fattore moltiplicativo, ma il valore in mq della superficie del posteggio.
help.letteratipo_linkdoc                                = obbligatorio in caso che sia spuntato "protocolla allegati come link"
help.letteretipo_archivi_base                           = Se selezionato la ricerca viene effettuata solo tra i tipi movimento degli archivi di base
help.lista_mercatid2cassegnaz                           = *I campi scelti in questa sezione potranno essere utilizzati all\u2019interno della configurazione del singolo posteggio per poter mettere dei vincoli in fase di assegnazione.
help.mailtipo.legenda_localita_estesa                   = Riporta una descrizionde del tipo:<br /> "Via Manzoni 45/A rosso".<br />Se presente il km sar\u00E0:<br/>" Via Manzoni Km 13 rosso"
help.mailtipo.legenda_localizzazione_via                = Riporta una descrizionde del tipo:<br /> "Via Manzoni".<br />Se non \u00E8 presente il prefisso sar\u00E0:<br/>"Manzoni"
help.mercati.presenze.concessione_uso                   = La scelta di questo campo determina la tipologia di durata della manifestazione. <br />Ad esempio se la manifestazione si svolge di per mezza giornata o per giornata intera. (Potrebbe variare i coefficenti di calcolo dell'occupazione dei posteggi)
help.mercati.presenze.flag_conteggia_presenze_assenze   = Se impostato a "S\u00EC" la gestione delle presenze viene fatta secondo le regole classiche. <br />Se impostato a non in ogni caso la presenza non viene impostata.
help.mercati.presenze.flag_popola_concessionari         = Se impostato a "S\u00EC" allora si tratta di una gestione "standard" nella quale i posteggi vengo assegnati ai relativi concessionari e valgono le regole di validazione per l'assegnazione dei posteggi. <br />\r\nSe impostato a "No" allora tutti i soggetti che partecipano vengono trattati come spuntisti e sono tenuti all'eventuale pagamento dell'occupazione. In questo caso non valgono le regole di verifica di accesso ai posteggi. <br />\u00C8 il caso, ad esempio, della gestione di una giornata di mercato per le feste di quartiere che vengono svolte in quel mercato ma in giorni, ad esempio di Domenica, dove non sono presenti concessioni. 
help.mercatidlivelloservizio.data_inzio_validita        = Se i campi data non verranno popolati di default il sistema imposter\u00E0 la 'data inizio validit\u00E0' e la 'data fine validit\u00E0' del livello di servizio
help.mercatilivelloservizio.aggiorna                    = Attenzione la modifica influir\u00E0 anche sui singoli posteggi a cui il servizio \u00E8 associato. Continuare?
help.mercatilivelloservizio.aggiorna_tariffa_servizio   = Attenzione la modifica influir\u00E0 anche sui singoli posteggi a cui il servizio \u00E8 associato. Continuare?
help.mercatilivelloservizio.data_fine_validita_aggiorna = La data verr\u00E0 impostata automaticamente come giorno precedende della data inizio validit\u00E0 dell'aggiornamento
help.mercatilivelloservizio.descrizione_aggiornamento   = E' possibile aggiornare la descrizione
help.modelli_archivi_base                               = Se selezionato la ricerca viene effettuata solo tra i modelli degli archivi di base
help.modifica_note_movimento                            = Selezionando il checkbox sar\u00F2 possibile modificare anche il campo note. L'operazione sar\u00E0 registrata dal sistema.
help.mostra_tutti                                       = Spuntando il checkbox verranno visualizzati tutti i campi di immissione esattamente come presentati in caso di inserimento normale
help.movimenti.chiusura.istanza                         = Non sono visualizzati gli stati di chiusura. Per chiudere l'istanza occorre eseguire il movimento di chiusura previsto nella procedura.
help.movimenti_archivi_base                             = Se selezionato mostra i tipo movimenti di base
help.oneritipirateizzazione.ripartizionerate            = Specificare le percentuali di riparytizione delle rate separate da";". <br/>\r\nEsempio: <b>40;20;20;20</b> <br/>\r\n<b>Attenzione:</b> Se il numero delle percentuali \u00E8 minore del numero delle rate, verr\u00E0 utilizzata l'ultima percentuale specificata per impostare le restanti rate.
help.oneritipirateizzazione.scadenzarate                = <b>Valori ammessi:</b>\r\n    <ol>\r\n    <li><i>Fine mese: </i>Dopo aver calcolato la scadenza della rata, la sposta alla fine del mese.</li>\r\n    <li><i>15 del mese: </i>Dopo aver calcolato la scadenza della rata, la imposta al prossimo 15 del mese.</li>\r\n    <li><i>Fine mese (esclusa la 1\u00B0 rata): </i>Sposta la scadenza della rata alla fine del mese. <b>Non modifica la scadenza della prima rata.</b></li>\r\n    <li><i>15 del mese (esclusa la 1\u00B0 rata): </i>Sposta la scadenza della rata al prossimo 15 del mese. <b>Non modifica la scadenza della prima rata.</b></li>\r\n    <li><i>Lascia inalterato: </i>Lascia inalterata la scadenza della rata calcolata.</li>\r\n    <li><i>15 del mese successivo: </i>Dopo aver calcolato la scadenza della rata, la imposta al 15 del mese successivo.</li>\r\n    <li><i>15 del mese successivo (esclusa la 1\u00B0 rata): </i>Sposta la scadenza della rata al 15 del mese successivo. <b>Non modifica la scadenza della prima rata.</b></li>\r\n    </ol>
help.oneritipirateizzazione.speseRateizzazioni          = L'importo sar\u00E0 aggiunto alla prima rata.
help.operatore_data_inserimento_movimento               = Operatore e data di inserimento.
help.protocollo_ruolo                                   = Specificare il codice del ruolo a cui \u00E8 associata l'amministrazione nel software di protocollo attivo
help.protocollo_unita_organizzativa                     = Specificare il codice dell'Unit\u00E0 Organizzativa/Ufficio a cui \u00E8 associata l'amministrazione nel software di protocollo attivo
help.pubblica_movimento                                 = Se spuntato, il movimento sar\u00E0 visualizzato nel front-office.
help.pubblica_parere                                    = Se spuntato, il parere del movimento sar\u00E0 visualizzato nel front-office.
help.responsabili.scadDatainizio                        = L'operatore deve indicare o una data o il numero di giorni a partire dai quali considerare la data dalla quale ricercare le scadenze
help.responsabili.scadSoftware                          = L'operatore deve indicare se filtrare le scadenze per un particolare modulo software
help.resposabiliassenze.descrizione                     = Le assenze sono utilizzate nella funzionalit\u00E0 di assegnazione degli istruttori per le norme anticorruzione
help.ricerca_dyn2campi_da_dyn2Modelli                   = Permette di ricercare i campi dinamici associati a una scheda.
help.ricerca_per_software_TT                            = Se selezionato, la ricerca verr\u00E0 effettuata sugli archivi di base
help.ricerca_range_km_istanze                           = La ricerca per Km e range (dal KM al KM) funziona solamente se specificato anche uno stradario tra i filtri. Inoltre siccome il dato nella base dati potrebbe essere non registrato correttamente potrebbe rilanciare errore la ricerca per range. Se si vuole ricercare per km/metri va specificato in questo formato km,metri (es: 90,250 per indicare dal kilometro 90 metro 250)
help.ricerca_responsabile                               = Ricerca resposabile
help.ricerca_testuale_endo                              = Permette di effettuare una ricerca testuale sui possibili endo procedimenti attivabili. Una volta effettuata la ricerca, si verr\u00E0 posizionati direttamente sull'endo scelto. 
