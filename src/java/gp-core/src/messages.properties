label.help_codice_amministrazioni_interne                                                = Le amministrazione che riportano, oltre la descrizione ed il codice, dei dati nelle parentesi quadre <br/>es: <b>"Asl territorialmente competente (12) [AAA-BBB]"</b><br/>rappresentano le amministrazioni configurate come <b><i>scrivanie del protocollo dell'ente</i></b>.<br />I dati nelle parentesi quadre sono i codici scrivania configurati.
label.help_configurazione_notifica_stc                                                   = <b>Comportamenti della Notifica</b><br />Durante la presentazione della maschera di notifica saranno selezionati di default gli allegati del movimento (se presenti) e gli allegati dell'endo di pertinenza del movimento (se presenti).<br />Spuntando il flag <b>"Spunta i documenti allegati all' istanza"</b> saranno selezionati anche tutti i documenti dell'istanza e spuntando il flag <b>"Spunta gli allegati di tutti gli endo"</b> saranno selezionati anche gli allegati degli endo attivati per l'istanza.<br />Se spuntato il flag <b>"Protocolla prima di notificare"</b> e non \u00E8 attivata la notifica automatica allora in fase di invio notifica verr\u00E0 presentato un messaggio di avvertimento che riporta "Non \u00E8 possibile notificare un movimento non protocollato. Protocollare il movimento prima di procedere alla notifica.
label.help_creato_correttamente                                                          = \u00E8 stato creato correttamente e salvato nella sezione allegati del movimento.
label.help_dismissione_amministrazionireferenti                                          = <b class="error_header" style="font-size: 16px">Attenzione!!</b><br /><br />La funzionalit\u00E0 \u00E8 stata dismessa.<br />Per associare un operatore ad un'amministrazione \u00E8 necessario aggiungere all'amministrazione un RUOLO al quale appartiene l'operatore.
label.help_export_csv                                                                    = Esporta tutta la documentazione allegata alla pratica in formato csv
label.help_firma_multipla_documenti                                                      = La presente schermata permette di applicare la firma digitale o rigettare i file selezionati e presenti nella sezione <b>"Documenti da firmare"</b>.<br /><b>"RIGETTA":</b> l'operatore pu\u00F2 negare la firma per i file selezionati apponendo anche una notazione.<br /><b>"FIRMA":</b> l'utente cliccando sul bottone <b>"FIRMA DIGITALE"</b> potr\u00E0, attraverso un componente che si interfaccia al proprio dispositivo di firma, apporre la firma ai documenti.
label.help_lista_archiviazioni_solo_errori                                               = Se selezionato, mostra nella lista solo quelle che hanno la spunta corretta in grigio
label.help_messaggio_riapertura_istanza_dopo_cancellazione_chiusura                      = Attenzione! E' stato cancellato il movimento di chiusura.<br />E' necessario assegnare un nuovo stato all'istanza in caso contrario l'istanza risulter\u00E0 chiusa.
label.help_modifica_intervento_istanza                                                   = La modifica dell'intervento comporta il cambiamento di una serie di informazioni legate alla pratica.<br />E' necessario come passo preliminare scegliere il nuovo intervento e successivamente le informazioni da aggiornare.<br />In fase di selezione delle modifiche verr\u00E0 presentata una lista di informazioni da selezionare:<br />se viene tolta la spunta ad una voce presente in "Situazione attuale" allora sar\u00E0 eliminato il rispettivo dato dall'istanza,<br />se viene aggiunta la spunta ad una voce presente in "Nuovo intervento" allora il dato sar\u00E0 aggiunto.
