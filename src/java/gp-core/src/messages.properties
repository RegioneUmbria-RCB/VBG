label.help.lista_naturaendo                                                              = (*) Durante l\u2019elaborazione delle schede di spiegazione di tipo 1 (endoprocedimenti) e 2 (interventi)  all\u2019interno delle schede \u00E8 presente il valore \u201CModalit\u00E0 apertura\u201D  che indica cosa si deve fare se attivato l\u2019endo o l\u2019intervento.\r\nSe viene mappata la modalit\u00E0 apertura con una natura endo allora, durante l\u2019elaborazione delle schede di spiegazione, quando vengono  creati gli endoprocedimenti (tipo1) e gli endo generati dall\u2019intervento (tipo2 - vedi parametro ENDO2_INVENTARIOPROCEDIMENTI della regola CART)  la natura endo sar\u00E0 associata all\u2019endo creato. Vale anche in aggiornamento se la natura endo \u00E8 nulla.\r\nSe non viene configurato questo parametro valgono le impostazioni del parametro ENDO_INVENTARIOPROC.CODNATURA della regola CART.\r\n
label.help.lista_stp_tipologie_endo2                                                     = (*) L\u2019azione associata all\u2019intervento (tipologie endo 2-CART) verr\u00E0 assegnata alla relativa foglia dell\u2019albero degli interventi che verr\u00E0 creata durante le operazioni di elaborazione del dizionario e durante l\u2019aggiunta degli interventi (pulsante \u201CAggiungi interventi\u201D).
