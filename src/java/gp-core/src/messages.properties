label.help.documenti_inviare_protocollo_genera_pratica                                   = E' stato generato il file <b>pratica_suap_[aaaammdd]</b>.xml secondo le specifiche del portale impresainungiorno.gov.it.<br />\r\nIl file \u00E8 stato aggiunto agli allegati del movimento corrente con descrizione <b>pratica_suap_[aaaammdd]</b>.<br />\r\nIl file xml fa riferimento ai documenti dell'istanza, degli endoprocedimenti ed alle eventuali procure<br />\r\ntali documenti dovranno essere <b>spuntati</b> durante il processo di protocollazione assieme al file xml stesso.<br />\r\n(Le specifiche prevedono esclusivamente allegati con le seguenti estensioni [.pdf.,pdf.,p7m,.xml,.dwf,.dwf.p7m,.svg,.svg.p7m,.jpg,.jpg.p7m], gli altri formati sono stati esclusi.)
