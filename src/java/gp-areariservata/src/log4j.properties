#impostazioni di log per AuditingSuFile per il layer web
log4j.logger.it.gruppoinit.auditing.web_activity=WARN, auditsufileweblogfile
log4j.additivity.it.gruppoinit.auditing.web_activity=false

#impostazioni di log per AuditingSuFile per gli errori dei services
log4j.logger.it.gruppoinit.auditing.service_errors=WARN, auditsufileserviceerrorlogfile
log4j.additivity.it.gruppoinit.auditing.service_errors=false

#impostazioni di log per le cancellazioni dei dati dell'istanza
log4j.logger.it.gruppoinit.auditing.dml_activity=DEBUG, loggermodificheistanze
log4j.additivity.it.gruppoinit.auditing.dml_activity=false

#impostazioni di log per tracciare le operazioni di del ws archivibackoffice
log4j.logger.it.gruppoinit.pal.gp.core.utils.LoggerArchiviBackoffice=INFO, loggerarchivibackoffice
log4j.additivity.it.gruppoinit.pal.gp.core.utils.LoggerArchiviBackoffice=false

#impostazioni di log per tracciare il processo di bollettazione 
log4j.logger.bollettazione=INFO, bollettazione_appender
log4j.additivity.bollettazione=false

#impostazioni di log per tracciare quanto avviene sugli oggetti
log4j.logger.features.oggetti=INFO, oggetti_appender
log4j.additivity.features.oggetti=false

#impostazioni di log per tracciare le attività sugli abbonamenti
log4j.logger.abbonamento = INFO, abbonamento_appender
log4j.additivity.abbonamento=false

#impostazioni di log per tracciare la stampigliatura del QRcode
log4j.logger.qrcode=INFO, qrcode_appender
log4j.additivity.qrcode=false
