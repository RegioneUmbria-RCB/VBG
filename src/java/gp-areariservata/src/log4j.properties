# Comment out the Log4J listener in web.xml to activate Log4J.
log4j.rootLogger=WARN, logfile

log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=%d %p [%c] %nAREA RISERVATA - <%m>%n

log4j.appender.logfile=org.apache.log4j.RollingFileAppender
log4j.appender.logfile.File=${catalina.base}/logs/gp-areariservata.log
log4j.appender.logfile.MaxFileSize=1024KB
log4j.appender.logfile.MaxBackupIndex=10
log4j.appender.logfile.layout=org.apache.log4j.PatternLayout
log4j.appender.logfile.layout.ConversionPattern=%d %p [%c] - %m%n


log4j.appender.auditsufileweblogfile=org.apache.log4j.DailyRollingFileAppender
log4j.appender.auditsufileweblogfile.File=${catalina.base}/logs/audit/gp-areariservata-audit-web.log
log4j.appender.auditsufileweblogfile.DatePattern='.'yyyy-MM-dd-HH'.txt'
#log4j.appender.auditsufileweblogfile.MaxBackupIndex=20
#log4j.appender.auditsufileweblogfile.MaxFileSize=10240KB
log4j.appender.auditsufileweblogfile.layout=org.apache.log4j.PatternLayout
log4j.appender.auditsufileweblogfile.layout.ConversionPattern=%d %n%m%n

log4j.appender.auditsufileserviceerrorlogfile=org.apache.log4j.DailyRollingFileAppender
log4j.appender.auditsufileserviceerrorlogfile.File=${catalina.base}/logs/audit/gp-areariservata-audit-servicerror.log
log4j.appender.auditsufileserviceerrorlogfile.DatePattern='.'yyyy-MM-dd'.txt'
#log4j.appender.auditsufileserviceerrorlogfile.MaxBackupIndex=20
#log4j.appender.auditsufileserviceerrorlogfile.MaxFileSize=10240KB
log4j.appender.auditsufileserviceerrorlogfile.layout=org.apache.log4j.PatternLayout
log4j.appender.auditsufileserviceerrorlogfile.layout.ConversionPattern=%d %n%m%n

log4j.appender.loggermodificheistanze=org.apache.log4j.DailyRollingFileAppender
log4j.appender.loggermodificheistanze.File=${catalina.base}/logs/audit/gp-areariservata-modifiche-istanze.log
log4j.appender.loggermodificheistanze.DatePattern='.'yyyy-MM-dd'.txt'
#log4j.appender.loggermodificheistanze.MaxBackupIndex=20
#log4j.appender.loggermodificheistanze.MaxFileSize=10240KB
log4j.appender.loggermodificheistanze.layout=org.apache.log4j.PatternLayout
log4j.appender.loggermodificheistanze.layout.ConversionPattern=%d %n%m%n

log4j.appender.loggerarchivibackoffice=org.apache.log4j.DailyRollingFileAppender
log4j.appender.loggerarchivibackoffice.File=${catalina.base}/logs/audit/gp-areariservata-archivi.log
log4j.appender.loggerarchivibackoffice.DatePattern='.'yyyy-MM-dd'.txt'
#log4j.appender.loggerarchivibackoffice.MaxBackupIndex=20
#log4j.appender.loggerarchivibackoffice.MaxFileSize=10240KB
log4j.appender.loggerarchivibackoffice.layout=org.apache.log4j.PatternLayout
log4j.appender.loggerarchivibackoffice.layout.ConversionPattern=%d %n%m%n

log4j.appender.bollettazione_appender=org.apache.log4j.DailyRollingFileAppender
log4j.appender.bollettazione_appender.File=${catalina.base}/logs/audit/gp-backoffice-bollettazione.log
log4j.appender.bollettazione_appender.DatePattern='.'yyyy-MM-dd'.txt'
log4j.appender.bollettazione_appender.layout=org.apache.log4j.PatternLayout
log4j.appender.bollettazione_appender.layout.ConversionPattern=%d %n%m%n

log4j.appender.oggetti_appender=org.apache.log4j.DailyRollingFileAppender
log4j.appender.oggetti_appender.File=${catalina.base}/logs/audit/gp-areariservata-oggetti.log
log4j.appender.oggetti_appender.DatePattern='.'yyyy-MM-dd'.txt'
log4j.appender.oggetti_appender.layout=org.apache.log4j.PatternLayout
log4j.appender.oggetti_appender.layout.ConversionPattern=%d %n%m%n

log4j.appender.abbonamento_appender=org.apache.log4j.DailyRollingFileAppender
log4j.appender.abbonamento_appender.File=${catalina.base}/logs/audit/gp-areariservata-abbonamento.log
log4j.appender.abbonamento_appender.DatePattern='.'yyyy-MM-dd'.txt'
log4j.appender.abbonamento_appender.layout=org.apache.log4j.PatternLayout
log4j.appender.abbonamento_appender.layout.ConversionPattern=%d %n%m%n

log4j.appender.qrcode_appender=org.apache.log4j.DailyRollingFileAppender
