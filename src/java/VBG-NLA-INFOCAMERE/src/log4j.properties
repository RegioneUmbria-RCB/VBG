#Comment out the Log4J listener in web.xml to activate Log4J.
log4j.rootLogger=WARN, logfile

log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=%d %p [%c] - <%m>%n

log4j.appender.logfile=org.apache.log4j.RollingFileAppender
log4j.appender.logfile.File=${catalina.base}/logs/nla-infocamere.log
log4j.appender.logfile.MaxFileSize=1024KB
log4j.appender.logfile.MaxBackupIndex=10
log4j.appender.logfile.layout=org.apache.log4j.PatternLayout
log4j.appender.logfile.layout.ConversionPattern=%d %p [%c] - <%m>%n

log4j.appender.activitylogfile=org.apache.log4j.RollingFileAppender
log4j.appender.activitylogfile.File=${catalina.base}/logs/nla-infocamere-activity.log
log4j.appender.activitylogfile.MaxBackupIndex=20
log4j.appender.activitylogfile.MaxFileSize=1024KB
log4j.appender.activitylogfile.layout=org.apache.log4j.PatternLayout
log4j.appender.activitylogfile.layout.ConversionPattern=%d %-5p - %m%n

log4j.appender.archiviocomunicazione=org.apache.log4j.RollingFileAppender
log4j.appender.archiviocomunicazione.File=${catalina.base}/logs/audit/archivi-comunicazioni.log
log4j.appender.archiviocomunicazione.MaxBackupIndex=20
log4j.appender.archiviocomunicazione.MaxFileSize=1024KB
log4j.appender.archiviocomunicazione.layout=org.apache.log4j.PatternLayout
log4j.appender.archiviocomunicazione.layout.ConversionPattern=%d %-5p - %m%n

log4j.appender.erroricomunicazione=org.apache.log4j.RollingFileAppender
log4j.appender.erroricomunicazione.File=${catalina.base}/logs/audit/archivi-errori-comunicazioni.log
log4j.appender.erroricomunicazione.MaxBackupIndex=20
log4j.appender.erroricomunicazione.MaxFileSize=1024KB
log4j.appender.erroricomunicazione.layout=org.apache.log4j.PatternLayout
log4j.appender.erroricomunicazione.layout.ConversionPattern=%d %-5p - %m%n



log4j.logger.it.gruppoinit=INFO
log4j.logger.org.springframework=WARN
log4j.logger.org.springframework.web.servlet=WARN

log4j.logger.org.apache.cxf=WARN
log4j.logger.org.apache.ws.security=WARN
#log delle chiamate soap(INFO=on,WARN=off)
log4j.logger.org.apache.cxf.services=WARN


# LoggerArchiviocomunicazioni
log4j.logger.it.gruppoinit.utilities.LoggerArchiviocomunicazioni=INFO, archiviocomunicazione
log4j.additivity.it.gruppoinit.utilities.LoggerArchiviocomunicazioni=false

# LoggerErroricomunicazioni

log4j.logger.it.gruppoinit.utilities.LoggerErroricomunicazioni=INFO, erroricomunicazione
log4j.additivity.it.gruppoinit.utilities.LoggerErroricomunicazioni=false

log4j.logger.registrazione_attivita=DEBUG, activitylogfile
log4j.additivity.registrazione_attivita=false
