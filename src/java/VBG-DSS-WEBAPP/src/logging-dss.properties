# Livelli di log per diagnostica LOTL e validazione firme (messaggi [LOTL]).
# Aggiungi queste righe a conf/logging.properties di Tomcat, poi riavvia:
#
# it.gruppoinit.dss.config.level = INFO
# it.gruppoinit.dss.validation.level = INFO
# it.gruppoinit.dss.servlet.level = INFO
#
# In alternativa avvia con: -Djava.util.logging.config.file=WEB-INF/classes/logging-dss.properties
it.gruppoinit.dss.config.level = INFO
it.gruppoinit.dss.validation.level = INFO
it.gruppoinit.dss.servlet.level = INFO
