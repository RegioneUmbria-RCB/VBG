<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
     th:replace="~{decorator_main :: layout(~{::title}, ~{::section})}">
<head>
	<title th:text="#{label.gestione_attivazioni}">label.gestione_attivazioni</title>
</head>
<body>
   <section class="section section-muted container"
   	 th:attr="aria-describedby=titleSection">
   
   	<h1 id="titleSection" th:text="#{label.gestione_attivazioni}">label.gestione_attivazioni</h1>

				<form id="inviodati" th:object="${comunisecurity}" th:action="${comunisecurity.displayMode ne 0 }?@{update.htm}:@{insert.htm}" method="post">
				
				 <div th:replace="~{fragments/forms :: common-parts}"></div>
				
				 
				 <div class="row mb-4">					
					    <label class="form-label" for="entity.id" th:text="#{label.alias}">label.alias</label>
					    <input type="text" class="form-control" 
							    	th:field="*{entity.id}"
							    	id="entity.id" 
							    	th:readonly="*{displayMode ne 0 }"
							    	/>
				
						<div th:replace="~{fragments/forms :: field-errors('entity.id')}"></div>
							    	
				 </div>
				 <div class="row mb-4">					
					    <label class="form-label" for="entity.descrizione" th:text="#{label.descrizione}">label.descrizione</label>
					    <input type="text" class="form-control" 
							    	th:field="*{entity.descrizione}" 
							    	id="entity.descrizione" 		
							    						    
							    	/>
						<div th:replace="~{fragments/forms :: field-errors('entity.descrizione')}"></div>
	
				    	
				 </div>					
				 					
				 <div class="row mb-4">					
					    <label class="form-label" for="entity.idcomune" th:text="#{label.idcomune}">label.idcomune</label>
					    <input type="text" class="form-control" 							    	 
							    	id="entity.idcomune" 		
							    	th:field="*{entity.idcomune}"							    	
							    	/>							    	
							    	<div th:replace="~{fragments/forms :: field-errors('entity.idcomune')}"/>
				 </div>		
				

				 <div class="row mb-4">					
					    <label class="form-label" for="entity.dbuser" th:text="#{label.dbuser}">label.dbuser</label>
					    <input type="text" class="form-control" 							    	 
							    	id="entity.dbuser" 		
							    	th:field="*{entity.dbuser}"							    	
							    	/>							    	
							    	<div th:replace="~{fragments/forms :: field-errors('entity.dbuser')}"/>
				 </div>		
				 <div class="row mb-4">					
					    <label class="form-label" for="entity.dbpwd" th:text="#{label.dbpwd}">label.dbpwd</label>
					    <input type="text" class="form-control" 							    	 
							    	id="entity.dbpwd" 		
							    	th:field="*{entity.dbpwd}"
							    	/>							    	
							    	<div th:replace="~{fragments/forms :: field-errors('entity.dbpwd')}"/>
				 </div>		
				 <div class="row mb-4">					
					    <label class="form-label" for="entity.owner" th:text="#{label.owner}">label.owner</label>
					    <input type="text" class="form-control" 							    	 
							    	id="entity.owner" 		
							    	th:field="*{entity.owner}"							    	
							    	/>							    	
							    	<div th:replace="~{fragments/forms :: field-errors('entity.owner')}"/>
				 </div>		

				<div class="row mb-4 form-check form-switch">					
					    <label class="form-check-label" for="attivo"
					    	 th:text="#{label.attivo}">label.attivo</label>
 						<input class="form-check-input" type="checkbox" role="switch" 
 							th:field="*{entity.attivo}" id="attivo" />
				 </div>							 

				 				 				 					
				 <div class="row">
					<div class="form-group">
						<div class="col-sm-offset-2 col-sm-10">
						
							<button type="button" 
								class="salva-action-form btn btn-primary" 
								th:text="#{button.save}">button.save</button>
								
								<button type="button" th:if="*{displayMode ne 0 }"
								class="elimina-action-form btn btn-secondary" 
								th:text="#{button.delete}">button.delete</button>
							 
							<button type="button" id="back" class="btn btn-secondary" 								
								th:onclick="location.href='list.htm'"
												th:text="#{button.back}">button.back</button>
						</div>
					</div>
				 </div>
				 
				 
	<!--/* COMUNISECURITY_CONNECTION */-->			 
		<div style="padding-top: 40px;">
			<div class="table-responsive">
				<table class="table table-sm table-striped table-hover table-bordered" style="font-size: 0.6em">
				    <thead>
				        <tr>
				        	<th scope="col" th:text="#{label.ambiente}"  width="5%"  />
				        	<th scope="col" th:text="#{label.connectionstring}" width="60%"/>
				            <th scope="col" th:text="#{label.provider}" />
				            <th scope="col" th:text="#{label.azioni}"  width="20%" />
				        </tr>
				    </thead>
				    <tbody>
	
				        <tr th:each="conn, itemStat : *{entity.comunisecurityConnections}">
				        	<td th:inline="text" style="font-weight: bolder">
				        	[[*{entity.comunisecurityConnections[__${itemStat.index}__].id.ambiente}]]
				        	<input type="hidden" class="form-control"  
					    		th:field="*{entity.comunisecurityConnections[__${itemStat.index}__].id.ambiente}" 
					    		th:id="${'comunisecurityConnections_'+ itemStat.index + '_id_ambiente'}" 					    	
					    	/>
				        	
				        	</td>
				        	<td th:inline="text" >
				        		<input type="text" class="form-control"  
					    		th:field="*{entity.comunisecurityConnections[__${itemStat.index}__].connectionstring}" 
					    		th:id="${'comunisecurityConnections_'+ itemStat.index + '_connectionstring'}" 						    	
					    	/>
					    	  
					    		<div th:replace="~{fragments/forms :: field-errors(field='${comunisecurity.entity.comunisecurityConnections[__${itemStat.index}__].connectionstring}')}"/>
									
				        	</td>
				        	<td>
				        	
				        		<select class="form-control" 
								 th:field="*{entity.comunisecurityConnections[__${itemStat.index}__].provider}">
								
										<optgroup label="JAVA" th:if="*{entity.comunisecurityConnections[__${itemStat.index}__].id.ambiente eq 'JAVA'}">
											  	<option th:value="'Oracle12c'"   th:text="'Oracle12c'"     	  />
												<option th:value="'Oracle12c'"   th:text="'Oracle12c'"     	  />
												<option th:value="'Oracle10g'"   th:text="'Oracle10g'"     	  />
												<option th:value="'Oracle'"      th:text="'Oracle'"      	  />
												<option th:value="'Oracle9i'"    th:text="'Oracle9i'"      	  />
												<option th:value="'MySql'"     	 th:text="'MySql'"     	      />
												<option th:value="'MySqlInnoDB'" th:text="'MySqlInnoDB'"      />
												<option th:value="'MySqlMyISAM'" th:text="'MySqlMyISAM'"      />
												<option th:value="'PostgreSQL'"  th:text="'PostgreSQL'"       />
												<option th:value="'SQLServer'"   th:text="'SQLServer'"     	  />																					
										</optgroup>
										<optgroup label="DOTNET" th:if="*{entity.comunisecurityConnections[__${itemStat.index}__].id.ambiente eq 'DOTNET'}">
											<c:if test="${connections_var.id.ambiente eq 'DOTNET'}">
												<option th:value="'OracleClient'"     th:text="'OracleClient'"    />
												<option th:value="'MySqlClient'"      th:text="'MySqlClient'"     />
												<option th:value="'OleDb'"            th:text="'OleDb'"           />
												<option th:value="'PostGreSQLClient'" th:text="'PostGreSQLClient'"/>
												<option th:value="'SqlClient'"        th:text="'SqlClient'"       />
										</optgroup>
										<optgroup label="ASP" th:if="*{entity.comunisecurityConnections[__${itemStat.index}__].id.ambiente eq 'ASP'}">
												<option th:value="'ASPPROVIDER'" th:text="'ASPPROVIDER'" />
										</optgroup>
										<optgroup label="AREA_PERSONALE" th:if="*{entity.comunisecurityConnections[__${itemStat.index}__].id.ambiente eq 'AREA_PERSONALE'}">
										
												<option th:value="'OracleClient'"    th:text="'OracleClient'"     />
												<option th:value="'MySqlClient'"     th:text="'MySqlClient'"      />
												<option th:value="'OleDb'"           th:text="'OleDb'"            />
												<option th:value="'PostGreSQLClient'"th:text="'PostGreSQLClient'" />
												<option th:value="'SqlClient'"       th:text="'SqlClient'"        />
										</optgroup>

								</select>
				        	
				        	</td>
	
				            <td>
		
								<div class="form-check form-switch" th:inline="text" >		
									
								    <label class="form-check-label" th:for="${'comunisecurityConnections_'+ itemStat.index + '_overrideConf'}">sovrascrivi configurazioni</label>
		 							<input 
		 									th:attr="data-ambiente=*{entity.comunisecurityConnections[__${itemStat.index}__].id.ambiente}" 
		 									class="form-check-input overrideConfigurazione" type="checkbox" role="switch" 
		 									th:field="*{entity.comunisecurityConnections[__${itemStat.index}__].overrideConf}" 
		 									th:id="${'comunisecurityConnections_'+ itemStat.index + '_overrideConf'}" 			 />
								 </div>
								 
								 <div class="dati-override" th:attr="data-ambiente=*{entity.comunisecurityConnections[__${itemStat.index}__].id.ambiente}" >
									<table>
											<tr>
												<td th:text="#{label.dbpwd}"  />
												<td>
													<input type="text" class="form-control"  
										    			th:field="*{entity.comunisecurityConnections[__${itemStat.index}__].dbuser}" 
										    			th:id="${'comunisecurityConnections_'+ itemStat.index + '_dbuser'}" />			
												</td>
											</tr>
											<tr>
												<td th:text="#{label.dbpwd}"  />
												<td>
													<input type="text" class="form-control"  
										    			th:field="*{entity.comunisecurityConnections[__${itemStat.index}__].dbpwd}" 
										    			th:id="${'comunisecurityConnections_'+ itemStat.index + '_dbpwd'}" />			
												</td>
											</tr>
											<tr>
												<td th:text="#{label.owner}"  />
												<td>
													<input type="text" class="form-control"  
										    			th:field="*{entity.comunisecurityConnections[__${itemStat.index}__].owner}" 
										    			th:id="${'comunisecurityConnections_'+ itemStat.index + '_owner'}" />	
												</td>
											</tr>
										</table>
								</div>
								 
								 
				            </td>
				            
				        </tr>
				    </tbody>
				</table>
			</div>				 
		</div>		 
				 
				 
				 
				 
				 
				</form>
				
		<script type='text/javascript'>
		
				function checkAmbiente(){
					
					const overrideConf = document.querySelectorAll(".overrideConfigurazione");
					for (let i = 0; i < overrideConf.length; i++) {
						
						let nascondi = overrideConf[i].checked === false;
						let ambienteDaNascondere = overrideConf[i].dataset.ambiente;
						mostraNascondiConfAmbiente(ambienteDaNascondere, nascondi);
					}
				}
				
				function mostraNascondiConfAmbiente(ambienteDaNascondere, nascondi){
					
					const overrideConf = document.querySelectorAll(".dati-override");
					for (let i = 0; i < overrideConf.length; i++) {
						if(overrideConf[i].dataset.ambiente === ambienteDaNascondere){
							if(nascondi){
								overrideConf[i].style.display='none'
							} else{								
								overrideConf[i].style.display='';
							}
						}
					}
				}
				
				
				document.addEventListener("DOMContentLoaded", function() {
					
					
					document.querySelectorAll('.overrideConfigurazione').forEach(d => {
						  
						  d.addEventListener('click', async (e) => {
							  checkAmbiente();				
							});
						  		

					  });
					
					
					checkAmbiente();
					});
			</script>				
				
				
	<script th:inline="javascript">
	
	document.addEventListener("DOMContentLoaded", function() {

		  document.querySelectorAll('.page-link').forEach(d => {
			  
			  d.addEventListener('click', async (e) => {
				  cerca(d.dataset.page);				
				});
			  		

		  });
		  
		  document.querySelectorAll('.salva-action-form').forEach(d => {

				d.addEventListener('click', async (e) => {					
					document.forms['inviodati'].submit();					
				});

			});
		  
		  document.querySelectorAll('.elimina-action-form').forEach(d => {

				d.addEventListener('click', async (e) => {
					if(confirm('[[#{javascript.confirm.delete}]]')){
						document.forms['inviodati'].action='delete.htm';
						document.forms['inviodati'].submit();
					}
				});

			});
		  
		  
	  });
	
	</script>		
  	
  </section>
  
  
</body>
</html>
