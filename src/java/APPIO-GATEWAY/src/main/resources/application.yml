server:
  servlet:
    application-display-name:  AppIo Gateway _NOME_VERSIONE_ 
  error:
    include-message: always
spring:
  datasource:
    #url: REDACTED
    #driver-class-name: oracle.jdbc.driver.OracleDriver
    #username: REDACTED
    #password: REDACTED
    url: REDACTED
    driver-class-name: com.mysql.jdbc.Driver
    username: REDACTED
    password: REDACTED
  mvc:
    pathmatch:
       matching-strategy: ant_path_matcher   
  jpa:
    hibernate:
      use-new-id-generator-mappings: false   
ioproxy:
  scope: am_application_scope, default
  authorization-uri: REDACTED
  token-uri: REDACTED
  
user-services:
  vbg:
    username: REDACTED
    password: REDACTED

developers-italia:
  server-endpoint-url: REDACTED
  
logging:
  file.name: ${catalina.base}/logs/appiogateway.log
  pattern:
#    console: "%d [%t] %-5level %logger{36} - %msg{nolookups}%n"
    file: "%d [%t] %-5level %logger{36} - %msg{nolookups}%n"
  level:
    com.paevolution: INFO
    com.m2evorah: WARN
    org.springframework: WARN
    org.springframework.jdbc.core.JdbcTemplate: WARN
    org.springframework.jdbc.core.StatementCreatorUtils: WARN
    org.hibernate: WARN

ud-connector:
  sandbox-endpoint-url: REDACTED
  
springdoc:
  packagesToScan: com.paevolution.appiogateway.web.controllers.api
  pathsToMatch: /messages, /messages/**

cron:
  expression: '0 * * ? * *'
  
  
