#JDBC DRIVERS (composto da chiave db.driver + nome del provider su tabella comunisecurity)
db.driver.Oracle=oracle.jdbc.OracleDriver
db.driver.Oracle9i=oracle.jdbc.OracleDriver
db.driver.Oracle10g=oracle.jdbc.OracleDriver
db.driver.Oracle12c=oracle.jdbc.OracleDriver
db.driver.MySql=com.mysql.cj.jdbc.Driver
db.driver.MySqlInnoDB=com.mysql.cj.jdbc.Driver
db.driver.MySqlMyISAM=com.mysql.cj.jdbc.Driver
db.driver.PostgreSQL=org.postgresql.Driver
#db.driver.SQLServer=com.microsoft.jdbc.sqlserver.SQLServerDriver
#da utilizzare con i driver jdbc-2.0, sqljdbc4.jar(per JRE6) o sqljdbc.jar(per JRE5)
#db.driver.SQLServer=com.microsoft.sqlserver.jdbc.SQLServerDriver
db.driver.SQLServer=net.sourceforge.jtds.jdbc.Driver

#HIBERNATE DIALECTS (composto da chiave hibernate.dialect + nome del provider su tabella comunisecurity)
hibernate.dialect.Oracle=org.hibernate.dialect.OracleDialect
hibernate.dialect.Oracle9i=org.hibernate.dialect.OracleDialect
hibernate.dialect.Oracle10g=org.hibernate.dialect.OracleDialect
hibernate.dialect.Oracle12c=org.hibernate.dialect.OracleDialect
hibernate.dialect.MySql=org.hibernate.dialect.MySQLDialect
hibernate.dialect.MySqlInnoDB=org.hibernate.dialect.MySQLDialect
hibernate.dialect.MySqlMyISAM=org.hibernate.dialect.MySQLDialect
hibernate.dialect.PostgreSQL=org.hibernate.dialect.PostgreSQLDialect
hibernate.dialect.SQLServer=org.hibernate.dialect.SQLServerDialect

#DB CONFIGS
db.config.minimumIdle=1
db.config.maximumPoolSize=10
db.config.idleTimeout=120000
db.config.maxLifetime=1800000
db.config.connectionTimeout=10000
db.config.validationTimeout=5000
db.config.leakDetectionThreshold=1800000
db.config.connectionTestQuery=SELECT 1 FROM DUAL

#HIBERNATE PROPS
hibernate.hbm2ddl.auto=none
hibernate.show_sql=false
hibernate.format_sql=false
hibernate.use_sql_comments=false
hibernate.cache.use_second_level_cache=false
