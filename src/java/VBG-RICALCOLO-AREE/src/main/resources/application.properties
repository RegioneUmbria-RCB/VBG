spring.application.name=@project.name@

spring.config.validate-on-startup=true

server.port=${RICALCOLOAREE_SERVER_PORT}

ricalcoloaree.tokenuser=REDACTED
ricalcoloaree.tokenpwd=REDACTED
ricalcoloaree.tokenurl=REDACTED

management.server.port=${RICALCOLOAREE_MANAGEMENT_PORT}
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

